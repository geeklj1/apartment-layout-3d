<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><meta name="description" content="九组定制柜的效果图、开柜细节与可旋转三维模型。">
<title>全屋柜体图册</title>
<link rel="stylesheet" href="assets/gallery.css"><link rel="preload" as="image" href="assets/media-hero.webp">
</head>
<body>
<a class="skip" href="#display">跳到当前柜体</a>
<header class="mast"><h1>全屋柜体图册</h1><span>九组定制柜</span></header>
<main>
<aside aria-label="选择柜体">
 <h2>柜体目录</h2><nav id="index" aria-label="柜体目录"></nav>
 <label class="mobile" for="choose">选择柜体</label><select class="mobile" id="choose"></select>
</aside>
<article id="display" tabindex="-1">
 <div class="head"><div><p class="location" id="zone">客餐厅</p><h2 id="title">电视与餐边组合柜</h2></div><span id="counter" aria-hidden="true">01 / 09</span></div>
 <div class="modes" aria-label="选择查看方式">
  <button type="button" data-mode="hero" aria-pressed="true">效果图</button><button type="button" data-mode="axo" aria-pressed="false">轴测图</button><button type="button" data-mode="open" aria-pressed="false">开柜图</button><button type="button" data-mode="model" aria-pressed="false">旋转模型</button>
 </div>
 <figure>
  <div class="stage">
   <img id="photo" width="1300" height="920" fetchpriority="high" src="assets/media-hero.webp" alt="电视与餐边组合柜的外观效果">
   <div id="model" hidden><canvas tabindex="0" aria-label="柜体三维模型，按左右方向键旋转，上下方向键改变俯仰"></canvas></div>
   <p id="status" hidden role="status"></p>
  </div>
  <div id="tools" hidden aria-label="模型操作"><div class="model-buttons">
    <button type="button" id="toggle" aria-pressed="false">打开柜门</button><button type="button" id="left">左转</button><button type="button" id="right">右转</button><button type="button" id="reset">复位</button>
  </div><span>拖动旋转，双指或滚轮缩放</span></div>
  <figcaption><span id="caption">外观效果</span><a id="original" href="assets/media-hero.webp" target="_blank" rel="noopener">查看大图 ↗</a></figcaption>
 </figure>
 <div class="details"><section><h3>设计要点</h3><p id="detail"></p></section><section><h3 id="dimlabel">模型外包 · 毫米</h3><p id="dim"></p></section></div>
</article>
</main>
<footer>效果与三维模型用于查看柜体方案，不作为生产下料尺寸。</footer>
<noscript>启用 JavaScript 以切换柜体和视角。</noscript>
<script src="assets/gallery.js" defer></script>
</body>
</html>
